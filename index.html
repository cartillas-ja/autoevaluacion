<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelo de la autoevaluación</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF6FF;--card:#fff;--ink:#1D2B53;--soft:#5B6A8F;--line:#CFE3F5;--sun:#FFC93C;--mint:#2FBF8F;--sky:#4DB1F2;--sel:#FFF1C2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A33;--card:#192646;--ink:#F2F6FF;--soft:#A9B7D9;--line:#2D3E6B;--sel:#4A3F12}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4}
.wrap{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:1.7rem;margin:4px 0 0;font-weight:800}
.sub{color:var(--soft);margin:0 0 8px}
.name{display:flex;gap:8px;align-items:center;margin:8px 0 12px}
input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;width:100%}
.main{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:start}
.card{background:var(--card);border-radius:22px;padding:14px;border:2px solid var(--line)}
.card h2{margin:0 0 4px;font-size:1.35rem}
.side{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));text-align:center}
#sky{position:relative;height:min(68vh,470px);min-height:340px;border-radius:46px;overflow:hidden;background:linear-gradient(#4DB1F2 0%,#BFE6FF 70%,#9BE0A8 100%);border:3px solid var(--card)}
#sky .cl{position:absolute;font-size:1.6rem;opacity:.9}
#sun{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:2.3rem}
#plane{position:absolute;left:50%;font-size:2.6rem;transform:translateX(-50%) rotate(-45deg);transition:bottom .8s cubic-bezier(.3,1.4,.5,1)}
#ticks{position:absolute;left:4px;top:56px;bottom:30px;display:flex;flex-direction:column;justify-content:space-between;font-size:.8rem;font-weight:800;color:#1D2B53;opacity:.7}
#th{position:relative;height:min(68vh,470px);min-height:340px;display:none}
#tube{position:absolute;left:50%;top:6px;bottom:52px;width:34px;margin-left:-17px;border:4px solid var(--line);border-radius:20px 20px 0 0;background:var(--card);overflow:hidden}
#fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#FF7A6B,#FFC93C);transition:height .8s cubic-bezier(.3,1.4,.5,1)}
#bulb{position:absolute;left:50%;bottom:10px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:#FF7A6B;border:4px solid var(--line)}
.thermo #sky{display:none}.thermo #th{display:block}
#grade{margin-top:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;font-size:2rem;font-weight:800;line-height:1.2}
#bubble{margin-top:4px;font-size:.85rem;font-weight:700;color:var(--soft)}
.swap{margin-top:6px;font:inherit;font-size:.8rem;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:2px 8px}
.q{padding:10px 0;border-top:2px dashed var(--line)}
.q p{margin:0 0 6px;font-weight:700}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.f,.btn{font:inherit;cursor:pointer;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.f{padding:6px 2px;font-size:.85rem;font-weight:700}
.f span{display:block;font-size:1.7rem;line-height:1.1}
.f[aria-pressed=true]{background:var(--sel);border-color:var(--sun);transform:scale(1.05)}
.f:disabled{cursor:default;opacity:.75}
.f:focus-visible,.btn:focus-visible,.swap:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:800;padding:10px 18px;font-size:1.1rem;margin-top:10px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.warn{background:var(--sel);border-radius:14px;padding:6px 12px;margin-top:8px;font-weight:700}
.res{margin-top:10px;text-align:center;font-weight:800;font-size:1.2rem;background:var(--sel);border-radius:16px;padding:10px}
.ok{margin-top:8px;text-align:center;font-weight:800;color:var(--mint)}
@media (prefers-reduced-motion:reduce){#plane,#fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ Vuelo de la autoevaluación</h1>
  <p class="sub">Empiezas en el suelo. ¡Con cada respuesta el avión sube hasta el sol!</p>
  <div class="name"><label for="nm">Piloto:</label><input id="nm" placeholder="Escribe tu nombre y apellido" autocomplete="off" maxlength="70"></div>
  <div class="main" id="main">
    <div class="card" id="panel"></div>
    <div class="side" aria-live="polite">
      <div id="sky"><span id="sun">🌞</span><span class="cl" style="left:8px;top:90px">☁️</span><span class="cl" style="right:6px;top:200px">☁️</span><div id="ticks"><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span></div><span id="plane">✈️</span></div>
      <div id="th"><div id="tube"><div id="fill"></div></div><div id="bulb"></div></div>
      <div id="grade">0,0</div><div id="bubble"></div>
      <button class="swap" id="swap">🌡️ Termómetro</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, CARAS as F, PREGUNTAS as QA } from "./config.js";

var db = getFirestore(initializeApp(firebaseConfig));
var N = QA.length;
var S={data:{},thermo:false};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nm(){return $("nm").value.trim()||"Piloto sin nombre"}
function cur(){var k=nm();return S.data[k]||(S.data[k]={ans:{},done:false,sending:false,sent:false,err:""})}
function fmt(n){return n.toFixed(1).replace(".",",")}
function grade(a){var p=0;for(var i=0;i<N;i++)if(a[i]!==undefined)p+=F[a[i]][2];return p}
function pending(a){var c=0;for(var i=0;i<N;i++)if(a[i]===undefined)c++;return c}
function fly(g,msg){
  var pct=g/N;
  $("plane").style.bottom=(4+pct*70)+"%";
  $("fill").style.height=(pct*100)+"%";
  $("grade").textContent=fmt(g);
  $("sun").textContent=g>=4.5?"😎":"🌞";
  $("bubble").textContent=msg||"";
}
function render(){
  $("main").className="main"+(S.thermo?" thermo":"");
  $("swap").textContent=S.thermo?"✈️ Avión":"🌡️ Termómetro";
  var d=cur(),g=grade(d.ans),pe=pending(d.ans);
  var h='<h2>Yo me evalúo</h2><p class="sub">Toca la carita que dice cómo te portaste.</p>';
  QA.forEach(function(q,i){
    h+='<div class="q"><p>'+q+'</p><div class="faces">'+F.map(function(f,j){return '<button class="f" data-q="'+i+'" data-v="'+j+'" aria-pressed="'+(d.ans[i]===j)+'"'+(d.sent?' disabled':'')+'><span>'+f[0]+'</span>'+f[1]+'</button>'}).join("")+'</div></div>';
  });
  h+='<div class="sub" style="margin-top:8px">Respondidas: '+(N-pe)+' de '+N+'</div>';
  if(pe&&!d.done)h+='<div class="warn">⚠️ Te faltan '+pe+'. Cada pregunta sin responder deja al avión más abajo.</div>';
  if(d.err)h+='<div class="warn">'+esc(d.err)+'</div>';
  if(d.sent){
    var m=g>=4.5?"¡Piloto estrella! 🌟":g>=4?"¡Gran vuelo! 🎈":g>=3?"Buen vuelo, sigue practicando 💪":"Vamos a despegar de nuevo, juntos 🤗";
    h+='<div class="res" id="out">¡Aterrizaste! Tu autoevaluación: '+fmt(g)+'<br>'+m+'</div>';
    h+='<div class="ok">✅ Tu profe ya recibió tu vuelo</div>';
    h+='<button class="btn alt" data-act="next">👤 Siguiente piloto</button>';
  }else h+='<button class="btn" data-act="done"'+(d.sending?' disabled':'')+'>'+(d.sending?'Aterrizando…':'¡Aterrizar!')+'</button>';
  $("panel").innerHTML=h;
  fly(g,pe?pe+" sin responder":"");
}
async function enviar(d){
  if(!$("nm").value.trim() || $("nm").value.trim().length<3){
    d.err="✏️ Escribe tu nombre de piloto arriba para que tu profe sepa que eres tú.";render();$("nm").focus();return;
  }
  d.err="";d.sending=true;render();
  var respuestas={};
  for(var i=0;i<N;i++)respuestas["p"+(i+1)]=d.ans[i]===undefined?"Sin responder":F[d.ans[i]][1];
  try{
    await addDoc(collection(db,"respuestas"),{
      nombre:$("nm").value.trim(),respuestas:respuestas,nota:Math.round(grade(d.ans)*10)/10,fecha:serverTimestamp()
    });
    d.sending=false;d.sent=true;d.done=true;
  }catch(x){
    console.error(x);d.sending=false;d.err="📶 No se pudo enviar. Revisa el internet y toca ¡Aterrizar! otra vez.";
  }
  render();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var d=cur();
  if(t.id==="swap"){S.thermo=!S.thermo;render();return}
  if(t.dataset.q){if(d.sent)return;d.ans[+t.dataset.q]=+t.dataset.v;d.done=false;d.err="";render();return}
  if(t.dataset.act==="done"&&!d.sending&&!d.sent){enviar(d)}
  if(t.dataset.act==="next"){$("nm").value="";S.data={};render();window.scrollTo(0,0);$("nm").focus()}
});
$("nm").addEventListener("input",render);
render();
</script>
</body>
</html>
